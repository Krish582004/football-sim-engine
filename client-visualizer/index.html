<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VectorPitch 3D Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #telemetry {
            position: absolute; bottom: 20px; left: 20px;
            color: #00ff00; font-family: 'Courier New', Courier, monospace; 
            background: rgba(0, 20, 0, 0.85); padding: 15px; 
            border-radius: 5px; border: 1px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            font-size: 14px; line-height: 1.5; pointer-events: none;
        }
        .telemetry-title { color: white; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #00ff00; }
        /* Upgrade the Scoreboard */
        #scoreboard {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: white; font-family: sans-serif;
            font-size: 28px; font-weight: bold; border-radius: 8px; border: 2px solid #555;
            display: flex; align-items: center; overflow: hidden;
        }
        .score-box { padding: 10px 20px; }
        .score-blue { background: #0033cc; }
        .score-red { background: #cc0000; }
        
        /* NEW: Match Clock UI */
        .match-clock { background: white; color: black; padding: 10px 20px; font-size: 22px; }

        /* NEW: Floating Player Tags */
        .player-tag {
            position: absolute; transform: translate(-50%, -50%);
            font-family: sans-serif; font-size: 11px; font-weight: bold; text-transform: uppercase;
            padding: 3px 6px; border-radius: 4px; color: white;
            pointer-events: none; text-shadow: 1px 1px 2px black; z-index: 10;
        }
        .tag-blue { background: rgba(0, 0, 255, 0.6); border: 1px solid blue; }
        .tag-red { background: rgba(255, 0, 0, 0.6); border: 1px solid red; }
        .tag-gold { background: rgba(255, 215, 0, 0.9); color: black; text-shadow: none; border: 1px solid orange; }
    </style>
</head>
<body>
    <div id="telemetry">Waiting for server...</div>
    <div id="scoreboard">
        <div class="score-box score-blue">BLU <span id="score-b">0</span></div>
        <div class="match-clock" id="match-clock">00:00</div>
        <div class="score-box score-red"><span id="score-r">0</span> RED</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene & Shadow-Enabled Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // --- NEW: Enable Soft Shadows ---
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- NEW: Stadium Lighting (Afternoon Sun) ---
        const ambientLight = new THREE.AmbientLight(0x404040, 1.2); // Soft base light
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
        sunLight.position.set(-40, 50, 30); // Angled from the top-left corner
        sunLight.castShadow = true;
        // Expand the shadow camera bounds to cover the entire 105x68 pitch
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        sunLight.shadow.mapSize.width = 2048; // High-res shadows
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- UPGRADED: Pitch (Lambert Material + receiveShadow) ---
        const pitchGeometry = new THREE.PlaneGeometry(105, 68);
        const pitchMaterial = new THREE.MeshLambertMaterial({ color: 0x2e8b57, side: THREE.DoubleSide });
        const pitch = new THREE.Mesh(pitchGeometry, pitchMaterial);
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true; // Let shadows fall on the grass
        scene.add(pitch);

        // Draw Goalposts (Upgraded to Lambert Material)
        function createGoal(xPos) {
            const goalGroup = new THREE.Group();
            const postGeo = new THREE.CylinderGeometry(0.2, 0.2, 2.44, 8);
            const barGeo = new THREE.CylinderGeometry(0.2, 0.2, 7.32, 8);  
            const goalMat = new THREE.MeshLambertMaterial({ color: 0xffffff }); 

            const leftPost = new THREE.Mesh(postGeo, goalMat);
            leftPost.position.set(0, 1.22, 3.66);
            leftPost.castShadow = true;
            
            const rightPost = new THREE.Mesh(postGeo, goalMat);
            rightPost.position.set(0, 1.22, -3.66);
            rightPost.castShadow = true;
            
            const crossbar = new THREE.Mesh(barGeo, goalMat);
            crossbar.rotation.x = Math.PI / 2;
            crossbar.position.set(0, 2.44, 0);
            crossbar.castShadow = true;

            goalGroup.add(leftPost); goalGroup.add(rightPost); goalGroup.add(crossbar);
            goalGroup.position.set(xPos, 0, 0);
            scene.add(goalGroup);
        }
        createGoal(-52.5); createGoal(52.5);

        // Draw Pitch Markings (Stays Basic Material so they glow bright white)
        function createPitchMarkings() {
            const markings = new THREE.Group();
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            function drawLine(x1, z1, x2, z2) {
                const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1, 0.02, z1), new THREE.Vector3(x2, 0.02, z2)]);
                markings.add(new THREE.Line(geo, lineMat));
            }
            drawLine(-52.5, -34, 52.5, -34); drawLine(-52.5, 34, 52.5, 34);
            drawLine(-52.5, -34, -52.5, 34); drawLine(52.5, -34, 52.5, 34); drawLine(0, -34, 0, 34);
            
            const circleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const centerCircle = new THREE.Mesh(new THREE.RingGeometry(9.15, 9.35, 64), circleMat);
            centerCircle.rotation.x = -Math.PI / 2; centerCircle.position.y = 0.02; markings.add(centerCircle);
            const centerDot = new THREE.Mesh(new THREE.CircleGeometry(0.3, 16), circleMat);
            centerDot.rotation.x = -Math.PI / 2; centerDot.position.y = 0.02; markings.add(centerDot);
            
            drawLine(-52.5, -20.16, -36, -20.16); drawLine(-52.5, 20.16, -36, 20.16); drawLine(-36, -20.16, -36, 20.16);
            drawLine(52.5, -20.16, 36, -20.16); drawLine(52.5, 20.16, 36, 20.16); drawLine(36, -20.16, 36, 20.16);
            scene.add(markings);
        }
        createPitchMarkings();

        // --- UPGRADED: Ball (Lambert + castShadow) ---
        const ballGeometry = new THREE.SphereGeometry(0.2, 32, 32); 
        const ballMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const ballMesh = new THREE.Mesh(ballGeometry, ballMaterial);
        ballMesh.castShadow = true;
        scene.add(ballMesh);

        // --- UPGRADED: Players (Lambert + castShadow) ---
        const playerMeshes = [];
        const playerGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
        const matBlue = new THREE.MeshLambertMaterial({ color: 0x0000ff });
        const matRed = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const matHuman = new THREE.MeshLambertMaterial({ color: 0xffd700 }); 

        for (let i = 0; i < 10; i++) {
            let mat = i < 5 ? matBlue : matRed;
            if (i === 0) mat = matHuman; 
            const mesh = new THREE.Mesh(playerGeometry, mat);
            mesh.castShadow = true; // NEW: Cast shadows onto grass
            mesh.receiveShadow = true; // NEW: Receive shadows from the ball flying over them
            scene.add(mesh);
            playerMeshes.push(mesh);
        }

        // Possession Ring (Stays Basic so it glows brightly)
        const ringGeo = new THREE.RingGeometry(0.5, 0.7, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide });
        const possessionRing = new THREE.Mesh(ringGeo, ringMat);
        possessionRing.rotation.x = -Math.PI / 2; possessionRing.position.y = 0.05; possessionRing.visible = false;
        scene.add(possessionRing);

        // Camera High Tactical View
        camera.position.set(0, 40, 45);
        camera.lookAt(0, 0, 0);

        const ws = new WebSocket("ws://localhost:8000/ws");
        const telemetry = document.getElementById("telemetry");

        // --- UPGRADED: EAFC Input Controller ---
        const keys = { w: false, a: false, s: false, d: false, shift: false, " ": false, e: false, f: false };
        window.addEventListener("keydown", (ev) => {
            const k = ev.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = true;
        });
        window.addEventListener("keyup", (ev) => {
            const k = ev.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = false;
        });

        // Broadcast inputs to Python every 16ms
        setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                let dx = 0; let dz = 0;
                if (keys.w) dz = -1;
                if (keys.s) dz = 1;
                if (keys.a) dx = -1;
                if (keys.d) dx = 1;
                
                ws.send(JSON.stringify({ 
                    dx: dx, dz: dz,
                    sprint: keys.shift, 
                    shoot: keys[" "],    
                    pass: keys.e,
                    lofted_pass: keys.f   // NEW: Send the lofted pass command
                }));
            }
        }, 16);

        let lastTime = performance.now();

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Calculate Ping / Tick Rate
            const now = performance.now();
            const msPerTick = (now - lastTime).toFixed(1);
            lastTime = now;

            // --- NEW: Calculate EAFC Match Time (60 ticks = 1 in-game minute) ---
            const gameMinutes = Math.floor(data.tick / 60);
            const displayMin = String(gameMinutes).padStart(2, '0');
            document.getElementById("match-clock").innerText = displayMin + ":00";

            // Update Scoreboard UI
            document.getElementById("score-b").innerText = data.score.blue;
            document.getElementById("score-r").innerText = data.score.red;
            
            ballMesh.position.set(data.ball.x, data.ball.y, data.ball.z);
            possessionRing.visible = false;

            for (let i = 0; i < 10; i++) {
                if (data.players[i]) {
                    // 1. Move the 3D Cylinder
                    playerMeshes[i].position.set(data.players[i].x, data.players[i].y, data.players[i].z);
                    
                    // 2. Move the Possession Ring
                    if (data.players[i].has_possession) {
                        possessionRing.position.x = data.players[i].x;
                        possessionRing.position.z = data.players[i].z;
                        possessionRing.visible = true;
                    }

                    // --- NEW: 3D to 2D Spatial Projection for Floating Tags ---
                    let tag = document.getElementById("tag-" + i);
                    if (!tag) {
                        // Create the HTML tag if it doesn't exist yet
                        tag = document.createElement("div");
                        tag.id = "tag-" + i;
                        let teamClass = data.players[i].team === 0 ? "tag-blue" : "tag-red";
                        if (i === 0) teamClass = "tag-gold"; // Human Player
                        tag.className = `player-tag ${teamClass}`;
                        
                        // Add an asterisk if they are the Goalkeeper
                        tag.innerText = data.players[i].playstyle === "Goalkeeper" ? "(GK)" : data.players[i].playstyle;
                        document.body.appendChild(tag);
                    }

                    // Project the 3D position onto the 2D screen
                    const pos = playerMeshes[i].position.clone();
                    pos.y += 1.5; // Hover 1.5 meters above the cylinder's center
                    pos.project(camera);
                    
                    // Convert normalized device coordinates to screen pixels
                    const screenX = (pos.x * 0.5 + 0.5) * window.innerWidth;
                    const screenY = (pos.y * -0.5 + 0.5) * window.innerHeight;
                    
                    tag.style.left = `${screenX}px`;
                    tag.style.top = `${screenY}px`;
                }
            }
            
            // Update Engineering HUD
            telemetry.innerHTML = `
                <div class="telemetry-title">SERVER TELEMETRY</div>
                Tick Rate : ${msPerTick} ms<br>
                Tick #    : ${data.tick}<br>
                State Hash: ${data.hash}<br>
                WASD: Move | SHIFT: Sprint<br>
                SPACE: Shoot | E: Pass | F: Lob
            `;
        };

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
