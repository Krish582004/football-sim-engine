<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VectorPitch 3D Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #telemetry {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: monospace; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="telemetry">Waiting for server...</div>
    
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Pitch
        const pitchGeometry = new THREE.PlaneGeometry(105, 68);
        const pitchMaterial = new THREE.MeshBasicMaterial({ color: 0x2e8b57, side: THREE.DoubleSide });
        const pitch = new THREE.Mesh(pitchGeometry, pitchMaterial);
        pitch.rotation.x = -Math.PI / 2;
        scene.add(pitch);

        // Ball
        const ballGeometry = new THREE.SphereGeometry(0.2, 32, 32); // Made ball slightly larger to see
        const ballMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const ballMesh = new THREE.Mesh(ballGeometry, ballMaterial);
        scene.add(ballMesh);

        // Players Array
        const playerMeshes = [];
        const playerGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
        const matBlue = new THREE.MeshBasicMaterial({ color: 0x0000ff });
        const matRed = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        for (let i = 0; i < 10; i++) {
            // First 5 are Blue (Team 0), last 5 are Red (Team 1)
            const mesh = new THREE.Mesh(playerGeometry, i < 5 ? matBlue : matRed);
            scene.add(mesh);
            playerMeshes.push(mesh);
        }

        // Camera High Tactical View
        camera.position.set(0, 40, 45);
        camera.lookAt(0, 0, 0);

        const ws = new WebSocket("ws://localhost:8000/ws");
        const telemetry = document.getElementById("telemetry");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Update Ball
            ballMesh.position.set(data.ball.x, data.ball.y, data.ball.z);
            
            // Update Players
            for (let i = 0; i < 10; i++) {
                if (data.players[i]) {
                    playerMeshes[i].position.set(
                        data.players[i].x, 
                        data.players[i].y, 
                        data.players[i].z
                    );
                }
            }
            
            telemetry.innerHTML = `Tick: ${data.tick} | 5v5 Live Match`;
        };

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
